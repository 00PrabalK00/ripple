name: Focused checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ripple_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ripple -d ripple_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ripple:test-only@localhost:5432/ripple_test
      RIPPLE_TEST_DATABASE_URL: postgresql://ripple:test-only@localhost:5432/ripple_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: npm ci
      - run: npm run db:migrate
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck db/schema.ts db/bridge.ts drizzle.config.ts
