# A customer-style robot: SMR300 hardware with stock Nav2 and no safety controller integrated
# into Ripple. Same simulator, different profile. Proves Ripple runs without code changes and
# that escape (and any teleop safety override) is off when no safety layer is declared.
schema_version: 1
robot: smr300_stock
ros_distro: humble
domain_id: 0
navigation:
  navigate_action: /navigate_to_pose
  internal_action_clients: [/bt_navigator]
  goal_input_topics: [/goal_pose]
  planner_action: /compute_path_to_pose
  lifecycle_nodes: [/amcl, /planner_server, /controller_server, /bt_navigator, /behavior_server]
  clear_services:
    global: /global_costmap/clear_entirely_global_costmap
    local: /local_costmap/clear_entirely_local_costmap
  keepout_adapter: none
  keepout_path: null
  verify_mask: null
  map_topic: /map
  global_frame: map
  base_frame: base_link
safety:
  required: false
  service: null
  parser: none
  max_age_s: 1.0
  never_touch: [/cmd_vel_safety, /cmd_vel_joy, /control_mode]
motion_inputs:
  navigation: {topic: /cmd_vel, priority: 10, max_age_s: 0.5}
motion_output: {topic: /diff_cont/cmd_vel_unstamped, max_age_s: 0.5}
odometry: {topic: /diff_cont/odom, max_age_s: 1.0}
localization: {topic: /amcl_pose, max_age_s: 5.0}
localization_refresh_service: /request_nomotion_update
covariance_xy_max: 0.5
covariance_yaw_max: 0.5
scans:
  front: {topic: /scan, max_age_s: 1.0}
mode: null
triggers:
  speed_below: 0.02
  turn_below: 0.02
  halted_for_s: 8
  flat_for_s: 15
  min_progress_m: 0.03
  goal_tolerance_m: 0.25
  failure_count: 3
  failure_window_s: 120
  localization_degraded_s: 5
logs:
  rosout_topic: /rosout
  nodes: [planner_server, controller_server, bt_navigator, amcl]
  min_level: 30
  journald_services: []
missions:
  channel: dashboard
  operators: [site-engineers]
  operator_command: go
  inferred_destination: go_announce
  agent_initiated: ask
  dispatch_checks: [station_registered, facts_fresh, keepouts_verified, route_probe_ok, safety_not_holding, mode_not_manual, single_owner]
recovery:
  clear_costmaps: {autonomy: auto, per_incident: 1}
  retry_goal: {autonomy: auto, per_incident: 1}
  lifecycle_reset: {autonomy: ask, per_incident: 1}
  reset_nodes: [/controller_server, /planner_server]
  escape:
    autonomy: 'off'
    backup_action: /backup
    spin_action: /spin
    max_backup_m: 0.30
    max_backup_mps: 0.15
    max_spin_rad: 1.57
    per_incident: 0
    requires: [safety_present, safety_not_holding, mode_not_manual, localization_fresh, no_active_goal, rear_scan_fresh]
stations:
  HOME: {frame: map, x: -0.79, y: -0.67, yaw: 0, label: Home dock, aliases: [home, dock]}
  Z3: {frame: map, x: -5.74, y: 1.33, yaw: 0, label: Staging Z3, aliases: [staging]}
  CHARGE: {frame: map, x: 0.71, y: -8.82, yaw: -0.044, label: Charger}
escalation_channel: dashboard
reply_timeout_s: 120
simulation: true
teleop: {topic: /cmd_vel_joy, max_speed_mps: 0.15, max_distance_m: 0.5, override_safety: false}
